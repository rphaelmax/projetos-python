{% extends "layout.html" %}
{% block title %}Nova locação{% endblock %}

{% block content %}
<h1>Nova locação</h1>

<form method="POST" action="{{ url_for('locadora.cadastrar') }}">
    <!-- Select para clientes -->
    <label for="cliente_id">Cliente:</label>
    <select name="cliente_id" id="cliente_id" required>
        <option value="" disabled selected>Selecione um cliente</option>
        {% for c in clientes %}
            <option value="{{ c.id }}">{{ c.nome }}</option>
        {% endfor %}
    </select>

    <!-- Outros campos do formulário -->
    <label for="veiculo_id">Veículo:</label>
    <select name="veiculo_id" id="veiculo_id" required>
        <option value="" disabled selected>Selecione um veículo</option>
        {% for v in veiculos %}
            <option value="{{ v.id }}">{{ v.modelo }}</option>
        {% endfor %}
    </select>

    <label for="data_inicio">Data de Início:</label>
    <input type="date" name="data_inicio" id="data_inicio" required>

    <label for="data_fim">Data de Fim:</label>
    <input type="date" name="data_fim" id="data_fim" required>

    <button type="submit">Cadastrar</button>
</form>

<p><a href="{{ url_for('locadora.index') }}">← Voltar</a></p>
{% endblock %}
