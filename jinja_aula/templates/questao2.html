{% extends 'base.html' %}

{% block title %}Nome e Idade{% endblock %}
{% block content %}
    <h1>Aluno e Idade</h1>
    <ul>
        {% for aluno in alunos %}
            <li>
                <div>Nome: {{ aluno.nome }}</div>
                <div>Idade: {{ aluno.idade }}</div>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
